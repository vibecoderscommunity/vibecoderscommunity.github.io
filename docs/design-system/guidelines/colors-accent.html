<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-mono);color:var(--ink)}.lbl{font-size:10px;color:var(--ink-soft);margin-top:4px;line-height:1.4}.sw{border:2px solid var(--ink);height:64px}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><div><div class="sw" style="background:var(--red);"></div><div class="lbl">--red · buttons, links, active<br>#e23d28</div></div><div><div class="sw" style="background:var(--red-dark);"></div><div class="lbl">--red-dark · hover<br>#b42a18</div></div><div><div class="sw" style="background:var(--red-tint);"></div><div class="lbl">--red-tint · link highlight<br>#f8d9d3</div></div></div></body></html>
