<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-mono);color:var(--ink)}.lbl{font-size:10px;color:var(--ink-soft);margin-top:4px;line-height:1.4}.sw{border:2px solid var(--ink);height:64px}@keyframes px-blink{0%,49%{opacity:1}50%,100%{opacity:0}}</style></head><body><div style="font-family:var(--font-pixel);font-weight:700;font-size:28px">SEE YOU AT THE NEXT ONE<span style="color:var(--red);animation:px-blink 1s steps(1) infinite">▮</span></div><div class="lbl" style="margin-top:10px">1s steps() blink · use once per surface, at the end of a heading</div></body></html>
