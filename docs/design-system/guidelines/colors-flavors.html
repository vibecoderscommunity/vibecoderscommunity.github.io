<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-mono);color:var(--ink)}.lbl{font-size:10px;color:var(--ink-soft);margin-top:4px;line-height:1.4}.sw{border:2px solid var(--ink);height:64px}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px"><div><div class="sw" style="background:var(--navy);"></div><div class="lbl">--navy<br>#131f63</div></div><div><div class="sw" style="background:var(--blue);"></div><div class="lbl">--blue<br>#2b3fc7</div></div><div><div class="sw" style="background:var(--lime);"></div><div class="lbl">--lime<br>#c7e64f</div></div><div><div class="sw" style="background:var(--purple);"></div><div class="lbl">--purple<br>#a985e8</div></div><div><div class="sw" style="background:var(--gold);"></div><div class="lbl">--gold<br>#e3c366</div></div><div><div class="sw" style="background:var(--peach);"></div><div class="lbl">--peach<br>#f0b489</div></div></div></body></html>
