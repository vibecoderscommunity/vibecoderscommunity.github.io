<!-- @dsCard group="Brand" viewport="700x190" name="Pixel Edges" subtitle="2px ink borders · hard offset shadows · zero blur, zero radius" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-mono);color:var(--ink)}.lbl{font-size:10px;color:var(--ink-soft);margin-top:4px;line-height:1.4}.sw{border:2px solid var(--ink);height:64px}</style></head><body><div style="display:flex;gap:32px;align-items:center;padding:8px">
<div style="background:var(--white);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:14px 18px;font-size:12px">--shadow-pixel-sm</div>
<div style="background:var(--white);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px 18px;font-size:12px">--shadow-pixel</div>
<div style="background:var(--white);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:14px 18px;font-size:12px">--shadow-pixel-lg</div>
<div style="background:var(--white);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--red);padding:14px 18px;font-size:12px">accent shadow</div></div>
<div class="lbl" style="margin-top:10px">Hover: translate(-2,-2) + shadow grows. Press: translate(2,2) + shadow gone.</div></body></html>
