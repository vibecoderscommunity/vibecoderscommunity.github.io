<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-mono);color:var(--ink)}.lbl{font-size:10px;color:var(--ink-soft);margin-top:4px;line-height:1.4}.sw{border:2px solid var(--ink);height:64px}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"><div><div class="sw" style="background:var(--ok);"></div><div class="lbl">--ok<br>#3d7a3a</div></div><div><div class="sw" style="background:var(--warn);"></div><div class="lbl">--warn<br>#b07818</div></div><div><div class="sw" style="background:var(--error);"></div><div class="lbl">--error<br>#b42a18</div></div><div><div class="sw" style="background:var(--surface-card);"></div><div class="lbl">--surface-card<br>white</div></div><div><div class="sw" style="background:var(--surface-inverse);"></div><div class="lbl">--surface-inverse<br>ink</div></div></div></body></html>
