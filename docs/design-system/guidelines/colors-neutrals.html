<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-mono);color:var(--ink)}.lbl{font-size:10px;color:var(--ink-soft);margin-top:4px;line-height:1.4}.sw{border:2px solid var(--ink);height:64px}</style></head><body><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px"><div><div class="sw" style="background:var(--ink);"></div><div class="lbl">--ink<br>#17130d</div></div><div><div class="sw" style="background:var(--ink-soft);"></div><div class="lbl">--ink-soft<br>#3d372c</div></div><div><div class="sw" style="background:var(--ink-faint);"></div><div class="lbl">--ink-faint<br>#7a7261</div></div><div><div class="sw" style="background:var(--paper-3);"></div><div class="lbl">--paper-3<br>#e2d6b8</div></div><div><div class="sw" style="background:var(--paper-2);"></div><div class="lbl">--paper-2<br>#ece3cd</div></div><div><div class="sw" style="background:var(--paper);"></div><div class="lbl">--paper<br>#f5efe1</div></div><div><div class="sw" style="background:var(--white);"></div><div class="lbl">--white<br>#fffdf7</div></div></div></body></html>
