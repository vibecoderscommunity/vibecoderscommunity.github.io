<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-mono);color:var(--ink)}.lbl{font-size:10px;color:var(--ink-soft);margin-top:4px;line-height:1.4}.sw{border:2px solid var(--ink);height:64px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div class="sw" style="height:110px;background:radial-gradient(circle at 55% 45%,#e86a55 0%,#efb0a0 55%,var(--paper) 100%)"></div>
<div class="sw" style="height:110px;background:linear-gradient(160deg,#f3ead6 0%,#e8c76a 100%)"></div>
<div class="sw" style="height:110px;background:radial-gradient(circle at 50% 40%,#9b6fe8 0%,#cbb2f2 55%,#f3eef7 100%)"></div>
<div class="sw" style="height:110px;background:linear-gradient(180deg,#2b3fc7 0%,#0d1440 100%)"></div></div>
<div class="lbl" style="margin-top:8px">red blob · warm gold · purple haze · deep night — pick ONE per surface</div></body></html>
