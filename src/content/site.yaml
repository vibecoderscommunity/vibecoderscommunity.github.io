# ---------------------------------------------------------------------------
# Site-wide content. Edit this file to change anything outside of event pages:
# the tagline, the chapter cards, the newsletter copy and the footer.
# No HTML or Vue changes required.
# ---------------------------------------------------------------------------

title: Vibe Coders Community
tagline: Tokyo · Singapore · Columbus
description: >-
  A cozy non-profit community to share our AI projects every month.
  We like to do fun group shareouts and the occasional workshop -
  come excited and engaged!

# Shown in the footer, and used as the <meta name="description"> fallback.
about: >-
  A cozy non-profit community to share our AI projects every month.
  We like to do fun group shareouts and the occasional workshop -
  come excited and engaged!

# Absolute URL of the deployed site — used for canonical links and og:url.
url: https://vibecoders.fyi

# ---------------------------------------------------------------------------
# Chapters — rendered as the "Three cities, one vibe" cards.
#
# The two dates are DERIVED, not written here:
#   next  the chapter's soonest event in src/content/upcoming/, or TBA
#   last  the chapter's most recent event in src/content/events/
# Both read the `date:` in that event's index.md, so moving a folder from
# upcoming/ to events/ updates these cards on the next build — nothing to edit.
#
#   next.flavor  one of: gold lime purple peach red-tint light-navy light-blue
#   next.label   OPTIONAL override; set it only to say what a date cannot
#   last         OPTIONAL override, same deal
#   logo         OPTIONAL path relative to this file; any image format Vite can
#                handle. Without one the card shows `abbr` as a pixel-font tile
#   abbr         OPTIONAL short name for that tile, e.g. CBUS
#   luma         OPTIONAL lu.ma calendar; without one the RSVP button is hidden
# ---------------------------------------------------------------------------
chapters:
  - id: tokyo
    name: Tokyo
    logo: ./chapters/tokyo.avif
    luma: https://luma.com/vibecoderstokyo
    linkedin: https://linkedin.com/company/vibe-coders-tokyo
    next:
      flavor: gold

  - id: singapore
    name: Singapore
    logo: ./chapters/singapore.png
    luma: https://luma.com/VibeCodersSG
    next:
      flavor: lime

  - id: columbus
    name: Columbus
    logo: ./chapters/cbus.avif
    luma: https://luma.com/vibecoderscolumbus
    next:
      flavor: purple

# ---------------------------------------------------------------------------
# Newsletter band copy. `highlight` is the word rendered in lime.
# ---------------------------------------------------------------------------
newsletter:
  heading: Sign up to be {highlight} of future events
  highlight: notified
  sub: >-
    The next meetup in Tokyo, Singapore and Columbus, straight to your inbox.
    No spam, unsubscribe whenever.
  success: You're in! See you at the next one
  cities:
    - value: tokyo
      label: Tokyo
    - value: singapore
      label: Singapore
    - value: columbus
      label: Columbus
    - value: else
      label: Somewhere else

# ---------------------------------------------------------------------------
# Channels — the chat and social links shown under the newsletter form.
#   label   platform name, rendered in the pixel font
#   handle  the short line under it; what people would type or search for
#   url     absolute link, opened in a new tab
# ---------------------------------------------------------------------------
channels:
  heading: Or come hang out with us
  links:
    - label: Discord
      handle: discord.gg/fyh4PdsjnU
      url: https://discord.gg/fyh4PdsjnU
    - label: LinkedIn
      handle: vibe-coders-tokyo
      url: https://www.linkedin.com/company/vibe-coders-tokyo/
